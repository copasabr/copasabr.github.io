<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bgGradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162f5c" />
      <stop offset="100%" stop-color="#0b172e" />
    </linearGradient>

    <!-- Gradientes de Elementos -->
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <!-- Filtros de Brilho Neon e Sombra -->
    <filter id="glowApp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>

    <filter id="shadowApp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Estilos de Animação CSS -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;display=swap');
      text { font-family: 'Century Gothic', system-ui, sans-serif; }

      /* Flutuação suave do card */
      .float-c {
        animation: flt 3.5s ease-in-out infinite;
      }
      @keyframes flt {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      /* Linha de comunicação animada (Data Flow) */
      .comm-line {
        stroke-dasharray: 6 6;
        animation: dataFlow 1.2s linear infinite;
      }
      @keyframes dataFlow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }

      /* Pacotes de dados trafegando (Usuário -> Terminal) */
      .data-packet {
        animation: sendData 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes sendData {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(148px); opacity: 0; }
      }

      /* Pulso no usuário */
      .user-pulse {
        animation: uPulse 2.5s ease-in-out infinite alternate;
        transform-origin: 100px 65px;
      }
      @keyframes uPulse {
        0% { filter: drop-shadow(0 0 2px #00f2fe); }
        100% { filter: drop-shadow(0 0 7px #00f2fe); }
      }

      /* Brilho da tela do terminal */
      .screen-glow {
        animation: scrBlink 3s ease-in-out infinite alternate;
      }
      @keyframes scrBlink {
        0% { fill: rgba(56, 239, 125, 0.15); }
        100% { fill: rgba(0, 242, 254, 0.35); }
      }
    </style>
  </defs>

  <!-- Fundo Principal -->
  <rect width="400" height="200" fill="url(#bgGradApp)" />

  <!-- Grade Tecnológica de Fundo -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="gridApp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" />
    </pattern>
    <rect width="400" height="200" fill="url(#gridApp)" />
  </g>

  <!-- Card Mini Dashboard -->
  <g class="float-c" filter="url(#shadowApp)">
    <!-- Base Glassmorphism -->
    <rect x="35" y="14" width="330" height="92" rx="10" fill="#112347" fill-opacity="0.8" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
    
    <!-- Topo da Janela -->
    <line x1="35" y1="32" x2="365" y2="32" stroke="rgba(255,255,255,0.08)" />
    <circle cx="50" cy="23" r="3" fill="#ff5f56" />
    <circle cx="60" cy="23" r="3" fill="#ffbd2e" />
    <circle cx="70" cy="23" r="3" fill="#27c93f" />

    <!-- ================= REDE DE COMUNICAÇÃO ================= -->
    <!-- Linha base de conexão -->
    <line x1="126" y1="65" x2="274" y2="65" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    
    <!-- Linha de dados ativa em movimento -->
    <line class="comm-line" x1="126" y1="65" x2="274" y2="65" stroke="#00f2fe" stroke-width="2" />

    <!-- Nó intermediário de rede/servidor -->
    <circle cx="200" cy="65" r="4" fill="#162f5c" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="200" cy="65" r="1.5" fill="#38ef7d" />

    <!-- Pacote de Dados Viajando -->
    <circle class="data-packet" cx="126" cy="65" r="3.5" fill="#38ef7d" filter="url(#glowApp)" />

    <!-- ================= ÍCONE DO USUÁRIO ================= -->
    <g class="user-pulse">
      <!-- Círculo de fundo do avatar -->
      <circle cx="100" cy="65" r="22" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.2" />
      
      <!-- Cabeça do boneco -->
      <circle cx="100" cy="56" r="6" fill="url(#userGrad)" />
      
      <!-- Corpo/Ombros do boneco -->
      <path d="M 88 75 C 88 68, 93 65, 100 65 C 107 65, 112 68, 112 75 Z" fill="url(#userGrad)" />
      
      <!-- Ponto de ancoragem do link -->
      <circle cx="122" cy="65" r="2.5" fill="#00f2fe" />
    </g>

    <!-- ================= ÍCONE DO TERMINAL (COMPUTADOR) ================= -->
    <g>
      <!-- Monitor / Tela -->
      <rect x="274" y="45" width="44" height="30" rx="4" fill="#0d1b36" stroke="url(#pcGrad)" stroke-width="1.5" />
      <rect class="screen-glow" x="277" y="48" width="38" height="24" rx="2" />
      
      <!-- Linhas de código na tela do terminal -->
      <line x1="281" y1="54" x2="295" y2="54" stroke="#38ef7d" stroke-width="1.5" stroke-linecap="round" />
      <line x1="281" y1="59" x2="307" y2="59" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" />
      <line x1="281" y1="64" x2="290" y2="64" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

      <!-- Suporte do Monitor -->
      <path d="M 293 75 L 299 75 L 301 82 L 291 82 Z" fill="url(#pcGrad)" opacity="0.8" />
      <rect x="287" y="82" width="18" height="2.5" rx="1" fill="#38ef7d" />

      <!-- Ponto de ancoragem do link -->
      <circle cx="274" cy="65" r="2.5" fill="#38ef7d" />
    </g>
  </g>

  <!-- Curva Inferior Decorativa -->
  <path d="M 0 135 Q 200 120 400 135 L 400 200 L 0 200 Z" fill="#0c1932" opacity="0.45" />

  <!-- Título Centralizado -->
  <g text-anchor="middle">
    <text x="200" y="156" font-size="16" font-weight="normal" fill="#ffffff" letter-spacing="0.5" filter="url(#shadowApp)">Painel de Serviços DOP</text>
    <rect x="170" y="168" width="60" height="2" rx="1" fill="#00f2fe" filter="url(#glowApp)" />
  </g>
</svg>
